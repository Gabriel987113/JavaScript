<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    let colores = ["rojo","azul","verde","amarillo"];
    function mostrarColores(){
        document.getElementById("resultado").value="";
        for(let i=0; i<colores.length; i++){
            document.getElementById("resultado").value+=colores[i] + "\n";
        }
    }


    function limpiar(){
     document.getElementById("resultado").value="";
    }
 
    </script>
</head>
<body>
    <label>Colores</label>

    <textarea id="resultado" cols="30" rows="30"></textarea>
    <button onclick="mostrarColores()">Mostrar</button>
    <button onclick="limpiar()" >Limpiar</button>
</body>
</html>
