<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

      function buscarPrecio(fruta){
             switch (fruta) {
 case "Naranjas":
 document.getElementsByTagName("textarea")[0].value="Naranjas cuestan 0,59€ el kilo.";
 break;
 case "Manzanas":
 document.getElementsByTagName("textarea")[0].value="Manzanas cuestan 0,32€ el kilo.";
 break;
 case "Plátanos":
 document.getElementsByTagName("textarea")[0].value="Plátanos cuestan 0,48€ el kilo.";
 break;
 case "Cerezas":
 document.getElementsByTagName("textarea")[0].value="Cerezas cuestan 3,00€ el kilo.";
 break;
 case "Mangos":
 document.getElementsByTagName("textarea")[0].value="Mangos cuestan 0,56€ el kilo.";
 break;
 case "Papayas":
 document.getElementsByTagName("textarea")[0].value="Mango y papayas cuestan 2,79€ el kilo.";
 break;
 default:
 document.getElementsByTagName("textarea")[0].value="Disculpa, no tenemos el tipo de fruta " + fruta + ".";
}

          
      }
    </script>
</head>
<body>
    <h2>SECCION FRUTAS</h2> <br>
    <h2>CONSULTA DE PRECIOS</h2> <br>

    <label>Nombre de la fruta:</label>
    <input type="text" onchange="buscarPrecio(this.value)"><br>

    <label>PRECIO</label><br>
    <textarea></textarea>

</body>
</html>
