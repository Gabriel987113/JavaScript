<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      /*
        3.- Crear una aplicación web que muestre cincuenta combinaciones para jugar a 
        la lotería primitiva.
        Las combinaciones son seis números del 1 al 49, pero hay que tener en cuenta que 
        no se pueden repetir los números.
        Generar tambien la combinacion ganadora y comprobar si alguna apuesta coincide con la
        ganadora.
        */

      function generar() {
        //LIMPIAR TODO AL EMPEZAR
        let loteria = [];
        document.getElementById("resultadoLoteria").innerHTML="";
        document.getElementById("combinacionGanadora").innerHTML="";
        document.getElementById("ganador").innerHTML="";

        //Generar las 50 apuestas.
        for (let i = 0; i < 50; i++) {

            let apuesta = new Set();

          while (apuesta.size < 6) {
            let numeroAleatorio = Math.floor(Math.random() * (49 - 1 + 1)) + 1;
            apuesta.add(numeroAleatorio);

          }

          loteria.push(apuesta);
        }

        //Generar la combinacion ganadora
        let combinacionGanadora = new Set();
        
          while (combinacionGanadora.size < 6) {
            let numAleatorioGanadora = Math.floor(Math.random() * (49 - 1 + 1)) + 1;
            combinacionGanadora.add(numAleatorioGanadora);
          }
        
        let arrayCombinacionGanadora = [...combinacionGanadora].join(", ");
        document.getElementById("combinacionGanadora").innerHTML =
          arrayCombinacionGanadora;

        //COMPROBAR SI ALGUIEN HA GANADO
          /*
          i = 0: loteria[0] es el primer Set, con 6 números. El bucle de dentro los comprueba uno a uno contra la ganadora y cuenta los aciertos.
          Termina esa apuesta. Aquí es donde tienes que usar los aciertos (mostrarlos y mirar si son 6), antes de pasar a la siguiente.
          i = 1: loteria[1] es otro Set con otros 6 números. aciertos vuelve a 0 y se repite todo.
          Así hasta i = 49, la apuesta número 50.

        */
        let textoApuestas = ""; //para mostrar jugador 1 y su apuesta...
        let hayGanador = false; // para saber si no hubo un ganador.

        for (let i = 0; i < loteria.length; i++) {
          let aciertos = 0;

          for (let numero of loteria[i]) {
            if (combinacionGanadora.has(numero)) {
              aciertos++;
            }
          }

          textoApuestas += "Jugador " + (i + 1) + ": " + [...loteria[i]].join(", ") + "<br>";

          if (aciertos == 6) {
            hayGanador = true;
            document.getElementById("ganador").innerHTML="El ganador fue el juagador: " + (i+1);
          }
        }

        if (!hayGanador) {
          document.getElementById("ganador").innerHTML = "No hubo ganador";
        }

        document.getElementById("resultadoLoteria").innerHTML = textoApuestas;

        /*
      Para comparar o recorrer un Set: for...of y has, sin convertir.
      Para mostrar un Set en pantalla: spread + join.
      */
      }
    </script>
  </head>
  <body>
    <h2>Loteria</h2>
    <button type="button" onclick="generar()">Generar Loteria</button>
    <div id="resultadoLoteria"></div>
    <br /><br />

    <div id="combinacionGanadora"></div>
    <br /><br />

    <div id="ganador"></div>
  </body>
</html>
