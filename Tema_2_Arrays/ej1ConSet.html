<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    let nums = [4,0,3,4,7,3,5,8,1,8,8,0,2,3,1,2,5,7,3,2,5,1];

    function sinRepetir(){
        //crea un conjunto utilizando los números del array nums.
        //Automáticamente elimina los números duplicados.
        let numsSinRepetir= new Set(nums);

        let numsFinalArray = [... numsSinRepetir];

        document.getElementById("areaMensaje").innerHTML=numsFinalArray;
       //document.getElementById("areaMensaje").innerHTML=[... numsSinRepetir];
    }
    </script>
</head>
<body>
    <div id="areaMensaje">

    </div>
    <button type="button" onclick="sinRepetir()">Generar sin repetir</button>
</body>
</html>
