
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triángulo rectángulo</title>
</head>
<body>
    <p id="resultado"></p>

    <script>
        let altura = 5;

        function triangulo() {
            let resultado = "";

            for (let i = 1; i <= altura; i++) {
                let fila = "";

                for (let j = 1; j <= i; j++) {
                    fila += "* ";
                }

                resultado += fila + "<br>";
            }

            return resultado;
        }

        document.getElementById("resultado").innerHTML = triangulo();
    </script>
</body>
</html>
