<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador configurable</title>
    <script>
       function contando(){
            let numeroInicio = Number(document.getElementsByTagName("input")[0].value);
            let numeroFinal = Number(document.getElementsByTagName("input")[1].value);
            let numeroPaso = Number(document.getElementsByTagName("input")[2].value);
            let pantalla = document.getElementById("pantalla"); //pantalla hace referencia al elmento textArea pero no su valor.
            
            pantalla.value = ""; 
           
            if (numeroPaso <= 0) { //hacemos esta condicion por si la persona pone un 0 en el paso
                pantalla.value = "El paso debe ser mayor que 0";
                return;
            }

            let resultado = "";
            
            if (numeroInicio > numeroFinal) {
                while (numeroInicio >= numeroFinal) {
                    resultado += "Cuenta = " + numeroInicio + "\n";
                    numeroInicio -= numeroPaso;
                }
            }else {
                while (numeroInicio <= numeroFinal) {
                    resultado += "Cuenta = " + numeroInicio + "\n";
                    numeroInicio += numeroPaso;
                }
            }
            
            pantalla.value = resultado;
        }
    </script>
</head>
<body>
    <h3>CONFIGURA TU PROPIO CONTADOR</h3><br>
    <table>
        <tr>
            <td><label for="">Inicio: </label>
                <input type="text" size="6" class="rango" autofocus></td><td>
                <label for="">Final: </label>
                <input type="text" size="6" class="rango"></td>
        </tr>
        <tr>

        </tr>
        <tr>
            <td><label for="">Paso: </label>
                <input type="text" size="6"></td><td></td>
        </tr>
        <tr>
            <td><input type="button" value="A CONTAR" onclick="contando()"></td><td></td>
        </tr>
    </table><br><br>

    <h3>VISUALIZACIÓN DE LA CUENTA</h3>
    <textarea id="pantalla" rows="10" cols="20"></textarea>   
    
</body>
</html>
