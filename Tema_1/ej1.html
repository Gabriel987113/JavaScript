<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
 
 let numero;
 do{


      numero=prompt("Introduce un numero");

     if(numero != null && !isNaN(numero)==true){
        alert("Has introducido el numero " + numero);
     }else{
        alert("No has introducido ningun numero");
     }

 }while(numero==null || isNaN(numero)==true);
    </script>
