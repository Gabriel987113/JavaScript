<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
      
       let juegoTerminado=false;

       let numeroAleatorio;

      function generarNumero(){

        if(numeroAleatorio!=undefined && juegoTerminado==false){
            alert("Ya hay una partida en curso");
            return;
        }
         numeroAleatorio=Math.floor(Math.random()*1000)+1;
         intentos=0;
         juegoTerminado=false;
      }

      let numeroElegido;
      let intentos=0;
      function adivinar(){
        if(juegoTerminado==true){
            alert("La partida acabo, elige otro numero");
            return;
        }

        if(numeroAleatorio==undefined){
            alert("Primero debes generar el numero aleatorio");
            return;
        }

        intentos++;
        numeroElegido=Number(document.getElementById("numero").value);

       if(numeroAleatorio==numeroElegido){
         juegoTerminado=true;
         alert("Has acertado!!! el numero secreto era "+numeroAleatorio +  
         "Numero de intentos: "+ intentos );

         let decision=confirm("Quieres volver a jugar??")
         if(decision==true){
            generarNumero();
         }else{
            alert("gracias por jugar");
         }
       }else if(numeroElegido > numeroAleatorio){
         alert("Error,prueba con un numero mas bajo")
       }else{
        alert("Error, prueba con un numero mas grande")
       }
      }

      function acabarJuego(){
        if(numeroAleatorio==undefined || juegoTerminado==true){
            alert("No hay ninguna partida activa");
            return;
        }

        juegoTerminado=true;

        alert("Has decididoi terminar el juego. " + 
              "El numero secreto era: "+ numeroAleatorio +
              "Numero de intentos: " +intentos);

        let respuesta=confirm("Quieres volver a jugar?");
        if(respuesta==true){
           generarNumero();
        }else{
         alert("Gracias por jugar!!");
        }
      }
    </script>
</head>
<body>
    <label>Introduce el numero:</label>
    <input type="number" id="numero">   <br><br>

    <button type="button" onclick="generarNumero()">Gnerar numero aleatorio</button>
    <button type="button" onclick="adivinar()">Intentar</button>
    <button type="button" onclick="acabarJuego()">Terminar intento</button>


</body>
</html>
