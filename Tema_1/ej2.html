<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let nombre;
        let apellidos;
        let salario;
        let edad;

        function mostrarDatos(){
        nombre=document.getElementById("nombre").value;
        apellidos=document.getElementById("apellidos").value;
        salario=Number(document.getElementById("salario").value);
        edad=Number(document.getElementById("edad").value);

        if(salario>=1000 && salario <=2000){
            if(edad>45){
                salario=(salario*0.03) + salario;
            }else{
                salario=(salario*0.10) + salario;
            }
        }else if(salario < 1000){
            if(edad<30){
                salario=1100;
            }else if(edad>=30 && edad<=45){
                salario=salario+(salario*0.03);
            }else{
                salario=salario+(salario*0.15);
            }
        }

        
        document.getElementById("resultado").innerHTML=
        "Nombre: " + nombre + "<br>" +
        "Apellidos: " + apellidos + "<br>" +
        "Salario: " + salario + "<br>" +
        "Edad: " + edad;
        }
    </script>
</head>
<body>
    <label>Nombre:</label>
    <input type="text" id="nombre"> <br><br>

    <label>Apellidos</label>
    <input type="text" id="apellidos"> <br><br>

    <label>Salario:</label>
    <input type="number" id="salario" step="any"> <br><br>

    <label>Edad:</label>
    <input type="number" id="edad"> <br><br>

    <button type=button onclick="mostrarDatos()">Enviar</button> <br><br>

    <p id="resultado"></p>
</body>
</html>
