<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function numeroAleatorio(){
            //Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
            let numero=Math.floor(Math.random()*6)+1;

            document.getElementById('numero').value=numero;

            let imagen = document.getElementById('imagenDado');

            if (numero == 1) {
                imagen.src = "dado1.png";
                imagen.alt = "Dado con el número 1";
            } 
            else if (numero == 2) {
                imagen.src = "dado2.png";
                imagen.alt = "Dado con el número 2";
            } 
            else if (numero == 3) {
                imagen.src = "dado3.png";
                imagen.alt = "Dado con el número 3";
            } 
            else if (numero == 4) {
                imagen.src = "dado4.png";
                imagen.alt = "Dado con el número 4";
            } 
            else if (numero == 5) {
                imagen.src = "dado5.png";
                imagen.alt = "Dado con el número 5";
            } 
            else if (numero == 6) {
                imagen.src = "dado6.png";
                imagen.alt = "Dado con el número 6";
            }
        
        }
    </script>
</head>
<body>
    <h2>TIRAR DADO</h2> <br><br>

    <label>Numero generado </label>
    <input type="number" id="numero">  <br><br>

    <div>
        <img id="imagenDado" src="" alt="Dado inicial">
    </div>

    <button type="button" onclick="numeroAleatorio()">Lanzar</button>

</body>
</html>
