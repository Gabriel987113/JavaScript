<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let contador=10;
        function elDecremento(){
          
            contador--;
          

          if(contador==0){
            contador=10;
          }

          document.getElementById("num1").value=contador;
          
        }

        function reiniciar(){
            contador=10;
            document.getElementById("num1").value=contador;
        }
    </script>
</head>
<body>
    
    <h2>Contador</h2>
    <label>NUMERO</label>
    <input type="number" id="num1" value="10"> <br><br>
    <button onclick="elDecremento()">decremento</button>
    <button onclick="reiniciar()">Reiniciar</button> 
</body>
</html>
