<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        let ventas="Toyota";
        function tiposCarro(nombre){
            if(nombre=="Honda"){
                return nombre;
            }else{
                return "No vendemos el coche " + nombre
            }
        }

        let carro={miCarro:"Saturn",
                   getCarro:tiposCarro("Gogog"),
                   especial:ventas
        };

        function leer(){
         document.getElementById("num1").value=carro.miCarro;
         document.getElementById("num2").value=carro.getCarro;
         document.getElementById("num3").value=carro.especial;
        }
    </script>
</head>
<body>
    <input type="text" id="num1" autofocus><br><br>
    <input type="text" id="num2" ><br><br>
    <input type="text" id="num3"><br><br>
    <input type="button" value="Visualizar datos" onclick="leer()">;
</body>
</html>
