<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         
         .si{
            width: 150px;
            height: 150px;
         }
    </style>
    <script>
        
     let deportes=["img/basket.svg","img/futbol.svg","img/tenis.svg","img/volley.svg"]
     let contador=0;

         function mostrar(){
        
            document.getElementById("resultado").src=deportes[contador];
            contador++;

            if(contador>=deportes.length){
                contador=0;
            }
         }

         //añdir un btoon que vaya para la izquierda l orientacion de imagenes.
    </script>
</head>
<body>
    <img id="resultado" class="si">
    <!--<img id="resultado" src="" alt="Deporte" style="width: 150px; height: 150px; display: block; margin-bottom: 10px;">   -->
    <button onclick="mostrar()">mostrar</button>
</body>
</html>
