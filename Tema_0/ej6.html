<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    
    function buscarPrecio(){
        let fruta=document.getElementsByTagName("input")[0].value;
        switch(fruta){
         case "Naranjas":
            document.getElementsByTagName("textarea")[0].value="Naranjas a 1 euro el kilo";
            break;

        case "Manzanas":
            document.getElementsByTagName("textarea")[0].value="Manzanas a 2 euros el kilo";
            break;

        case "Uvas":
            document.getElementsByTagName("textarea")[0].value="Uvas a 4 euros el kilo";
            break;

        default:document.getElementsByTagName("textarea")[0].value="No tenemos " + fruta;
        }
    }
    </script>
</head>
<body>
   <label>Nombre de la fruta a buscar:</label>
   <input type="text" onchange="buscarPrecio()"> <br><br>

   <label>Precio</label>
   <textarea></textarea>

</body>
</html>
