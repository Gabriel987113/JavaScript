<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
      function mostrarEntradaEnSalida(){
       document.getElementById("salida").value=document.getElementById('entrada').value;
      }
    </script>
</head>
<body>
    <input type="text" id="entrada" autofocus>
    <input type="text" id="salida">
    <button type="button" onclick="mostrarEntradaEnSalida()">Pulsa aqui</button>
</body>
</html>
