<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function transformar(){
            let texto=document.getElementById("frase").value;
            let clave = Number(document.getElementById("clave").value);
            let resultado="";
            
              for (let i = 0; i < texto.length; i++) {
                let codigoUnicode = texto.charCodeAt(i);
                let nuevoCaracter = String.fromCharCode(codigoUnicode + clave);

                resultado = resultado + nuevoCaracter;
            }

            document.getElementById("resultado").textContent = resultado;
        }

    </script>
</head>
<body>
    <label>Introduce un texto</label>
    <input type="text" id="frase"> <br><br>

    <label>Introduce una clave</label>
    <input type="number" id="clave">

    <button type="button" onclick="transformar()">Enviar</button>

    <p id="resultado"></p>
</body>
</html>
