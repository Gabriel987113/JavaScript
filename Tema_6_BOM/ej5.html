<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso select</title>
</head>
<body>
    <form action="">
        <b><i>Selecciona el tipo o tipos de música que te gusta</i></b><br><br>
        <select id="musica" multiple size="4">
            <option value="Rock&Roll">Rock&Roll</option>
            <option value="Clásica">Clásica</option>
            <option value="Heavy">Heavy</option>
            <option value="Electrónica">Electrónica</option>
            <option value="Tecno">Tecno</option>
        </select><br><br>
        <textarea id="pantalla" cols="30" rows="10"></textarea><br><br>
        <input type="button" value="Visualizar" onclick="visualizar();">
    </form>
    <script>
        
        function visualizar(){
            let tipoMusica = document.getElementById("musica");

            for(let i=0; i<tipoMusica.options.length; i++){

                if(tipoMusica.options[i].selected){
                    document.getElementById("pantalla").value+=tipoMusica.options[i].value + ", ";
                }
            }
        }
    </script>
</body>
</html>
