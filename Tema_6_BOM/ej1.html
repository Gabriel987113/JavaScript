<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlando Radio-check-Select</title>
</head>
<body>
    <h2>INTRODUZCA LOS DATOS</h2><br><br>
    <label for="">Apellidos: </label>
    <input type="text" id="apellidos"><br><br>
    <label for="">DNI: </label>
    <input type="text" id="dni"><br><br>

    <h3>Indique su sexo</h3><br><br>
    <input type="radio" name="sexo" value="M">Mujer</input><br><br>
    <input type="radio" name="sexo" value="H">Hombre</input><br><br>

    <h3>Seleccione la comunidad a la que pertenece</h3><br><br>
    <select name="comunidades" size="1">
        <option value="aelegir">Seleccione una comunidad</option>
        <option value="Asturias">Asturias</option>
        <option value="La Rioja">La Rioja</option>
        <option value="Madrid">Madrid</option>
        <option value="Navarra">Navarra</option>
        <option value="Canarias">Islas Canarias</option>
        <option value="Baleares">Islas Baleares</option>
        <option value="Murcia">Murcia</option>
        <option value="Cantabria">Cantabria</option>
        <option value="Euzkadi">Euzcadi</option>
        <option value="Galicia">Galicia</option>
        <option value="Aragón">Aragón</option>
    </select><br><br>

    <h3>Seleccione los servicios que necesita</h3><br><br>
    <input type="checkbox" name="servicios" value="Cultura">Cultura</input><br><br>
    <input type="checkbox" name="servicios" value="Sanidad">Sanidad</input><br><br>
    <input type="checkbox" name="servicios" value="Educación">Educación</input><br><br>

    <input type="button" value="Registrar" onclick="capturardatos()">
    <div id="resultado">

    </div>

    <script>
      function capturardatos() {
        let apellidos = document.getElementById("apellidos").value;
        let dni = document.getElementById("dni").value;
        let sexo = document.getElementsByName("sexo");
        let comunidades = document.getElementsByName("comunidades");
        let servicios = document.getElementsByName("servicios");

        let resultado = "";

        resultado+="Apellidos:" + apellidos + " DNI:"+dni + "<br>";

        for(let i=0; i<sexo.length; i++){
            if(sexo[i].checked){
                resultado+="SEXO: " + sexo[i].value + "<br>";
                break;
            }
        }

        resultado+=comunidades[0].value + "<br>";

        resultado+="Servicios: "
        for(let i=0; i<servicios.length; i++){
            if(servicios[i].checked){
                resultado+=servicios[i].value + ", ";
            }
        }

        document.getElementById("resultado").innerHTML=resultado;
      }
    </script>

</body>
</html>
