<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu del Dia</title>

<body>
 
    <a>Menu del Dia</a>
    <form name="opciones">
        <p><b>Elige el primer plato: </b>
            <select size="1" name="primer_plato">
                <option value="" selected>Selecciona primer plato</option>
                <option value="Garbanzos">Garbanzos</option>
                <option value="Lentejas">Lentejas</option>
                <option value="Judias Verdes">Judias Verdes</option>
                <option value="Paella">Paella</option>

            </select>
        </p>
        <p>&nbsp;<b>Elige el segundo plato: </b>

            <select size="3" name="segundo_plato" multiple>

                <option value="Entrecot">Entrecot a la plancha</option>
                <option value="Pescado">Pescado a la plancha</option>
                <option value="Cochinillo">Cochinillo frito</option>
                <option value="Huevos" selected>Huevos con bacon y chorizo</option>

            </select>
        </p>
        <p><b>Postre: </b>
            <input type="radio" name="postre" value="Fruta" checked>Fruta
            <input type="radio" name="postre" value="Helado">Helado
            <input type="radio" name="postre" value="Yogur">Yogur
            <input type="radio" name="postre" value="Otro">Otro<br><br>

        </p>
        <input type="button" value="Ver Menu" name="Ver" onclick="verSeleccion(this.form)">

        <textarea cols="30" rows="10" id="resultado"></textarea>

    </form>

    <script>
        //checked se utiliza con los input de tipo radio y checkbox.
        //En un <select>, para saber qué opción está seleccionada, utilizamos .value.

        function verSeleccion(){

            let primerPlato = document.getElementsByName("primer_plato");
            let segundoPlato = document.getElementsByName("segundo_plato");
            let postre = document.getElementsByName("postre");
            let resultado = "";

            //PRIMER PLATO
            resultado+=primerPlato[0].value + "\n";

            //SEGUNDO PLATO
            for(let i=0; i<segundoPlato[0].options.length; i++){
                if(segundoPlato[0].options[i].selected){
                    resultado+="Segundo plato:" + segundoPlato[0].options[i].value + "\n";
                }
            }

            //TERCER PLATO
            for(let i=0; i<postre.length; i++){
                if(postre[i].checked){
                    resultado+="Postre: " + postre[i].value;
                }
            }

            document.getElementById("resultado").value=resultado;


        }
    </script>

</body>

</html>
